# Optional GitLab Pages publish. GitHub Pages serves the repository root directly.
# Project site URL must stay /pocket-chaos-poc/ to match <base href="/pocket-chaos-poc/">.
pages:
  stage: deploy
  script:
    - mkdir -p public/assets
    - cp index.html 404.html favicon.ico .nojekyll *.js *.css public/
    - cp assets/loup-rose-poc.png public/assets/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
